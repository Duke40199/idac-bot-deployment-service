apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.example.yaml is intentionally NOT listed — the Secret (the tunnel token)
# is created out-of-band by SEALING (see that file + scripts/seal-secret.sh). The
# encrypted SealedSecret lives in the overlay, because it's bound to THIS cluster's
# key. There's no ConfigMap: a token-based tunnel's routing lives in the Cloudflare
# dashboard, so the Deployment is the only non-secret resource.
resources:
  - deployment.yaml
