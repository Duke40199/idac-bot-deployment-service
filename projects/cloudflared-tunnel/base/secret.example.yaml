# EXAMPLE ONLY — do NOT commit a real Secret and do NOT add this file to
# kustomization.yaml. This documents the shape of the Secret the cloudflared
# Deployment expects (env TUNNEL_TOKEN <- secretKeyRef cloudflared-tunnel-token).
#
# The real Secret is produced by SEALING your local secret.env into an encrypted
# SealedSecret that is safe to commit to this public repo:
#
#   cp secret.env.example secret.env     # then paste the real token (gitignored)
#   ./scripts/seal-secret.sh cloudflared # -> overlays/local/sealed-secret.yaml
#
# ArgoCD syncs that SealedSecret; the sealed-secrets controller unseals it into the
# live Secret shown below, which the Deployment reads via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel-token
  labels:
    app: cloudflared
type: Opaque
stringData:
  # The Cloudflare Tunnel token (dashboard install command, the value after --token).
  TUNNEL_TOKEN: "REPLACE_ME"