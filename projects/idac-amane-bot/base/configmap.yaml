# Non-secret, non-identifying config for idac-amane-bot. SAFE TO PUBLISH.
#
# Everything sensitive OR identifying (the bot token, DB credentials/host/name,
# Discord IDs, and the SEGA/All.Net endpoints) lives in the Secret instead, which
# is created out-of-band and never committed. See secret.example.yaml. The
# Deployment does envFrom on BOTH this ConfigMap and that Secret, so Kubernetes
# merges them into the container environment — splitting keys across the two is
# transparent to the app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: idac-amane-bot-config
  labels:
    app: idac-amane-bot
data:
  APP_ENV: "dev" # "dev" => debug logging; anything else => info
  PORT: "10000" # health server; must match containerPort in deployment.yaml

  # --- OB Active Players sync (tuning only, not sensitive) ---
  OB_ACTIVE_PLAYERS_SYNC_INTERVAL_MINUTES: "15"
  OB_ACTIVE_PLAYERS_DOWNTIME_START_HOUR: "0"
  OB_ACTIVE_PLAYERS_DOWNTIME_END_HOUR: "0"
  OB_ACTIVE_PLAYERS_DOWNTIME_TZ: "Asia/Tokyo"

  # --- OB Meta Cars sync (tuning only, not sensitive) ---
  OB_META_CARS_SYNC_INTERVAL_MINUTES: "15"
  OB_META_CARS_DOWNTIME_START_HOUR: "0"
  OB_META_CARS_DOWNTIME_END_HOUR: "0"
  OB_META_CARS_DOWNTIME_TZ: "Asia/Tokyo"

  # --- Database (connection target/creds are in the Secret) ---
  DB_PORT: "5432"
  # require (default) | verify-full | disable. Local PG without TLS => disable.
  DB_SSLMODE: "disable"

  # DB table names have code defaults; override here only if your schema differs.
  # These are schema identifiers, not secrets, so they're fine to keep public.
