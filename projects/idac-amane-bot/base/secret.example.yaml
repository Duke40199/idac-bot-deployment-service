# EXAMPLE ONLY — do NOT commit a real Secret and do NOT add this file to
# kustomization.yaml. This documents the shape of the Secret the Deployment
# expects (envFrom secretRef: idac-amane-bot-secret).
#
# This holds everything sensitive OR identifying — not just credentials, but also
# the DB target, Discord IDs and the SEGA/All.Net endpoints — so none of it ends
# up in the public Git repo. Everything innocuous is in configmap.yaml instead.
#
# You do NOT apply this file. The real Secret is produced by SEALING your local
# secret.env into an encrypted SealedSecret that is safe to commit publicly:
#
#   cp secret.env.example secret.env   # then fill in real values (gitignored)
#   ./scripts/seal-secret.sh           # -> overlays/local/sealed-secret.yaml
#
# ArgoCD syncs that SealedSecret; the sealed-secrets controller unseals it into the
# live Secret shown below, which the Deployment consumes via envFrom. See the
# README "Updating things over time" section for the full loop.
apiVersion: v1
kind: Secret
metadata:
  name: idac-amane-bot-secret
  labels:
    app: idac-amane-bot
type: Opaque
stringData:
  # --- Credentials (true secrets) ---
  DISCORD_BOT_TOKEN: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"

  # --- Database target (kept private, not strictly secret) ---
  # host.minikube.internal = your host machine as seen from inside minikube.
  DB_HOST: "host.minikube.internal"
  DB_NAME: "REPLACE_ME"
  DB_USER: "REPLACE_ME"

  # --- Discord identifiers ---
  DISCORD_BOT_OWNER_ID: "REPLACE_ME"
  DISCORD_OB_ACTIVE_PLAYERS_CHANNEL_ID: "REPLACE_ME"
  DISCORD_OB_META_CARS_CHANNEL_ID: "REPLACE_ME"

  # --- SEGA Initial D The Arcade endpoints ---
  SEGA_IDAC_HOST: "REPLACE_ME"
  SEGA_IDAC_GET_CURRENT_ROUND_URL_PATH: "REPLACE_ME"
  SEGA_IDAC_GET_LIST_CONST_CFG_URL_PATH: "REPLACE_ME"
  SEGA_IDAC_GET_LIST_OB_RANKING_URL_PATH: "REPLACE_ME"
  SEGA_IDAC_GET_LIST_PLAYER_GRADE_URL_PATH: "REPLACE_ME"
  SEGA_IDAC_GET_TEAM_RANKING_URL_PATH: "REPLACE_ME"
  SEGA_IDAC_GET_TIME_TRAIL_URL_PATH: "REPLACE_ME"

  # --- All.Net endpoints ---
  ALLNET_HOST: "REPLACE_ME"
  ALLNET_GET_LIST_STORE_LOCATION_URL_PATH: "REPLACE_ME"
  ALLNET_IDAC_GAME_CODE: "REPLACE_ME"
  ALLNET_EN_LANGUAGE_CODE: "REPLACE_ME"
